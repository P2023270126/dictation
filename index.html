<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictation Coach</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Dictation Coach</p>
      <h1>默書練習</h1>
      <p class="subtitle">選擇文章後，按「開始默書」。每句會自動朗讀 3 次，系統會自動讀取最新 Google Sheet 文章庫。</p>
    </header>

    <section class="practice-panel" aria-label="默書練習">
      <div class="field-group">
        <label for="articleSelect">選擇文章</label>
        <select id="articleSelect">
          <option value="">正在讀取文章...</option>
        </select>
      </div>

      <button id="startBtn" class="start-button" type="button" disabled>開始默書</button>

      <div class="progress-row">
        <span id="progressText">尚未開始</span>
        <span id="statusText">正在連接文章庫...</span>
      </div>

      <div class="controls" aria-label="播放控制">
        <button id="prevBtn" type="button" disabled>上一句</button>
        <button id="nextBtn" type="button" disabled>下一句</button>
        <button id="repeatBtn" type="button" disabled>重讀一次</button>
        <button id="repeatAllBtn" type="button" disabled>重讀全文</button>
        <button id="stopBtn" type="button" disabled>停止朗讀</button>
      </div>
    </section>

    <section class="settings-panel" aria-label="朗讀聲音設定">
      <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false">
        朗讀聲音設定
      </button>

      <div id="settingsBody" class="settings-body" hidden>
        <div class="voice-grid">
          <div class="field-group">
            <label for="zhVoiceSelect">中文 / 粵語聲音</label>
            <select id="zhVoiceSelect">
              <option value="auto">自動選擇（女聲優先）</option>
            </select>
          </div>

          <div class="field-group">
            <label for="enVoiceSelect">英文聲音</label>
            <select id="enVoiceSelect">
              <option value="auto">自動選擇（女聲優先）</option>
            </select>
          </div>
        </div>

        <div class="settings-actions">
          <button id="refreshVoicesBtn" type="button">重新偵測聲音</button>
          <p id="voiceStatus">正在偵測可用聲音...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
